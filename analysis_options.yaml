include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    # Generated by gen-l10n, which still emits the deprecated
    # flutter_localizations delegates. The app uses
    # lib/core/l10n/app_localizations_delegates.dart instead.
    - lib/l10n/app_localizations*.dart
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
