org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options=-Xmx2048m
# Ignored on AGP 9+: R8 full mode is always on. Missing Play Core split-install
# classes are handled with -dontwarn in app/proguard-rules.pro.
android.enableR8.fullMode=false
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false
# AGP 9 built-in Kotlin. app/build.gradle no longer applies the Kotlin Gradle
# Plugin, and the Kotlin plugins in use (firebase_*, package_info_plus) only
# apply KGP when this is false.
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
