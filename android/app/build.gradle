plugins {
    id "com.android.application"
    // Kotlin comes from AGP 9's built-in Kotlin (android.builtInKotlin=true);
    // the Kotlin version is the one declared in settings.gradle.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
android {
    namespace "com.recycleorigin.recycleorigin"
    // Plugins such as flutter_secure_storage 11 compile against API 37.
    // targetSdk stays 36 (Play requirement from Aug 31, 2026).
    compileSdk 37
    ndkVersion = "28.2.13676358"

    lintOptions {
        disable 'InvalidPackage'
        // lintVitalAnalyze* copies plugin lint jars into a cache. On Windows
        // that file is often still locked by a previous Gradle daemon, Defender,
        // or the IDE, which fails the AAB with FileSystemException. Flutter
        // release quality is gated by dart analyze / tests, not Android lint.
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        resValues true
    }

    defaultConfig {
        applicationId "com.recycleorigin.recycleorigin"
        minSdkVersion 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

    }
    flavorDimensions "environment"
    productFlavors {
        dev {
            dimension "environment"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "RecycleOrigin Dev"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            resValue "string", "app_name", "RecycleOrigin Staging"
        }
        prod {
            dimension "environment"
            resValue "string", "app_name", "RecycleOrigin"
        }
    }
    signingConfigs {
        debug {

        }
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // Play Store builds: create android/key.properties (see key.properties.example).
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// Fail fast instead of silently signing a release build with the debug key.
gradle.taskGraph.whenReady { graph ->
    def building = graph.allTasks.any {
        (it.name.startsWith('assemble') || it.name.startsWith('bundle') || it.name.startsWith('package')) &&
            it.name.endsWith('Release')
    }
    if (building && !keystorePropertiesFile.exists()) {
        throw new GradleException("Release build requires android/key.properties (see key.properties.example). Refusing to sign with the debug key.")
    }
}

flutter {
    source '../..'
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
    apply plugin: "com.google.firebase.crashlytics"
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

}
