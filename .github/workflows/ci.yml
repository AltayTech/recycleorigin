name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Create env files from templates
        # Real env files are gitignored; CI uses the committed examples.
        run: |
          for f in dev staging prod; do
            [ -f assets/env/.env.$f ] || cp assets/env/.env.$f.example assets/env/.env.$f
          done
      - run: flutter --version
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        # Existing info-level lints are tracked as tech debt; errors/warnings fail the build.
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test --coverage

  build-android-debug:
    runs-on: ubuntu-latest
    needs: analyze-test
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Create env files from templates
        # Real env files are gitignored; CI uses the committed examples.
        run: |
          for f in dev staging prod; do
            [ -f assets/env/.env.$f ] || cp assets/env/.env.$f.example assets/env/.env.$f
          done
      - run: flutter pub get
      - run: flutter build apk --debug --flavor dev -t lib/main_dev.dart
