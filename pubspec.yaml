name: recycleorigin
description: Application of RecycleOrigin

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.3.1+12

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  http: ^1.6.0
  intl: ^0.20.2
  flutter_widget_from_html_core: ^0.17.0
  url_launcher: ^6.3.2
  html: ^0.15.6
  flutter_spinkit: ^5.2.2
  #  shamsi_date: ^1.0.4
  carousel_slider: ^5.1.1
  google_maps_flutter: ^2.14.0
  fluttertoast: ^9.0.0

  cupertino_icons: ^1.0.8
  badges: ^3.1.2
  geolocator: ^14.0.2
  flutter_osm_plugin: ^1.3.7
  dartz: ^0.10.1
  loading_animation_widget: ^1.3.0
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: any
  dio: ^5.9.0
  google_fonts: ^6.3.3
  package_info_plus: ^8.1.1
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.8
  http_mock_adapter: ^0.6.1
  fake_async: ^1.3.1


flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/


  fonts:
    #   - family: Schyler
    #     fonts:
    #       - asset: fonts/Schyler-Regular.ttf
    #       - asset: fonts/Schyler-Italic.ttf
    #         style: italic
    - family: Iransans
      fonts:
        - asset: assets/fonts/IRANSansMobile.ttf
        - asset: assets/fonts/IRANSansMobile_Bold.ttf
        - asset: assets/fonts/IRANSansMobile_Light.ttf
        - asset: assets/fonts/IRANSansMobile_UltraLight.ttf
          weight: 700
    - family: IransansNonEn
      fonts:
        - asset: assets/fonts/IRANSansMobileNoEnMedium.ttf
          weight: 700
    - family: BFarnaz
      fonts:
        - asset: assets/fonts/B_Farnaz.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
        - asset: assets/fonts/roboto/Roboto-Light.ttf
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          weight: 700


