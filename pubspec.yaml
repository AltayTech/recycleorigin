name: recycleorigin
description: Application of RecycleOrigin

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.5+17

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3
  http: ^1.6.0
  intl: ^0.20.2
  flutter_widget_from_html_core: ^0.17.0
  url_launcher: ^6.3.2
  flutter_spinkit: ^5.2.2
  carousel_slider: ^5.1.1
  fluttertoast: ^9.0.0

  cupertino_icons: ^1.0.8
  badges: ^3.1.2
  geolocator: ^14.0.2
  flutter_osm_plugin: ^1.4.3
  dartz: ^0.10.1
  loading_animation_widget: ^1.3.0
  flutter_localizations:
    sdk: flutter
  dio: ^5.9.0
  package_info_plus: ^9.0.1
  flutter_secure_storage: ^10.0.0
  flutter_dotenv: ^6.0.0
  flutter_bloc: ^9.1.1
  fl_chart: ^1.2.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  firebase_auth: ^6.1.0
  google_sign_in: ^6.3.0
  flutter_local_notifications: ^21.0.0
  permission_handler: ^12.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^10.0.0


flutter:
  default-flavor: dev
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/env/.env.dev
    - assets/env/.env.staging
    - assets/env/.env.prod


  fonts:
    #   - family: Schyler
    #     fonts:
    #       - asset: fonts/Schyler-Regular.ttf
    #       - asset: fonts/Schyler-Italic.ttf
    #         style: italic
    - family: Iransans
      fonts:
        - asset: assets/fonts/IRANSansMobile.ttf
        - asset: assets/fonts/IRANSansMobile_Bold.ttf
        - asset: assets/fonts/IRANSansMobile_Light.ttf
        - asset: assets/fonts/IRANSansMobile_UltraLight.ttf
          weight: 700
    - family: IransansNonEn
      fonts:
        - asset: assets/fonts/IRANSansMobileNoEnMedium.ttf
          weight: 700
    - family: BFarnaz
      fonts:
        - asset: assets/fonts/B_Farnaz.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
        - asset: assets/fonts/roboto/Roboto-Light.ttf
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          weight: 700


